components:
  schemas:
    Achievement:
      type: object
      properties:
        id:
          type: string
          maxLength: 36
        icon_url:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 75
        description:
          type: string
          maxLength: 300
        icon:
          type: string
          maxLength: 100
        has_vc:
          type: boolean
        tags: {}
        type:
          type: string
          maxLength: 36
        template_id:
          type: string
          nullable: true
          maxLength: 100
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        level_id:
          type: string
          nullable: true
        updated_by:
          type: string
        created_by:
          type: string
      required:
      - created_at
      - created_by
      - description
      - has_vc
      - icon_url
      - name
      - tags
      - type
      - updated_at
      - updated_by
    AchievementAuditLogItem:
      type: object
      properties:
        id:
          type: string
        achievement_id:
