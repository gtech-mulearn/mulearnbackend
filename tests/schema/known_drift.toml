[[enum]]
table = "system_action_log"
column = "action_type"
kind = "missing_in_choices"
values = ["PERSONA_SWITCH"]
owner = "administration"

# The model has the push and broadcast actions; the vendored schema (db-scripts main) doesn't
# yet, so writing these fails until the alters that add them are applied and re-vendored.
[[enum]]
table = "system_action_log"
column = "action_type"
kind = "missing_in_enum"
values = [
    "NOTIF_BROADCAST_CREATE",
    "NOTIF_BROADCAST_DELETE",
    "NOTIF_BROADCAST_DEL_ALL",
    "NOTIF_BROADCAST_SEND",
    "NOTIF_BROADCAST_UPDATE",
    "PUSH_CAMPAIGN_CANCEL",
    "PUSH_CAMPAIGN_CREATE",
    "PUSH_CAMPAIGN_SEND",
    "PUSH_CONFIG_UPDATE",
    "PUSH_TEST_SEND",
]
owner = "administration"

[[enum]]
table = "user_job_application"
column = "status"
kind = "no_choices"
values = ["In-Review", "Interview", "Pending", "Rejected", "Selected", "Shortlisted"]
owner = "careers"

# ---------------------------------------------------------------------------------------------
# [[model]]: unmanaged models against information_schema (issue 0053).
#
# Kinds:
#   missing_table        the model's table doesn't exist
#   missing_column       a model field's column doesn't exist; every query selecting it fails (1054)
#   nullability          the model's null differs from the column's: null=True on a NOT NULL column
#                        fails on write (1048); null=False on a NULL column can read a None
#   max_length           a CharField allows more than its column: longer values fail on write (1406)
#   missing_foreign_key  a ForeignKey (db_constraint=True) has no matching database foreign key
#
# The two missing_column entries on interest_group (cover_image_key, icon_image_key) came with
# backend 62cf57aa, on dev only. No db-scripts alter adds them, so interest-group queries fail on
# any database built from db-scripts; they need an alter before dev ships.

