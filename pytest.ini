[pytest]
markers =
    mysql: needs the MySQL test database; run with scripts/test.sh --mysql
# xunit1 keeps each testcase's file attribute, which scripts/legacy_ratchet.py needs to rebuild node ids.
junit_family = xunit1
# Django removal warnings are errors in new code: the root conftest adds those filterwarnings
# lines from tests/deprecations.py, because the warning classes differ between Django versions.
