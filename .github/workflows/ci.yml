# Checks every pull request: ruff on new-code paths and the unit test tier.
# The unit tier runs on in-memory SQLite (scripts/test.sh), so it can't reach any database,
# and the job uses no secrets. Branch rules require the "ci / unit" check (issue 0029).
name: ci

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install mysqlclient's build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check
          ruff format --check

      - name: Unit tests (SQLite tier)
        run: |
          cp .env.sample .env
          scripts/test.sh tests/
