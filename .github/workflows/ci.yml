# Checks every pull request: ruff on new-code paths, the import contracts, the unit test tier,
# and the legacy suite against its baseline (tests/legacy_baseline.txt). Both test jobs run
# on in-memory SQLite (scripts/test.sh), so they can't reach any database, and they use no
# secrets. Branch rules require the "ci / unit" check (issue 0029).
name: ci

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install mysqlclient's build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check
          ruff format --check

      # The import contracts in .importlinter, generated from tests/architecture/module_graph.toml.
      - name: Import contracts
        run: lint-imports --no-cache

      - name: Unit tests (SQLite tier)
        run: |
          cp .env.sample .env
          scripts/test.sh tests/ building_blocks/

  legacy:
    name: legacy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install mysqlclient's build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The suite has known failures, so its exit code is ignored here. The ratchet decides,
      # and it also fails if pytest crashed before writing the report.
      - name: Whole suite (SQLite tier)
        run: |
          cp .env.sample .env
          scripts/test.sh --junitxml=legacy.xml -p no:cacheprovider || true

      - name: Compare with the baseline
        run: python scripts/legacy_ratchet.py legacy.xml

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-junit
          path: legacy.xml
          if-no-files-found: ignore
          retention-days: 7
