# Checks every pull request: ruff on new-code paths, the import contracts, the unit test tier,
# the legacy suite against its baseline (tests/legacy_baseline.txt), and the MySQL tier.
# The unit and legacy jobs run on in-memory SQLite (scripts/test.sh). The mysql job runs
# against a MySQL service container that only the job can reach, with a CI-only password.
# No job uses secrets. Branch rules require the "ci / unit" check (issue 0029).
name: ci

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install mysqlclient's build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        # Every package pinned and hash-checked (issue 0039). It includes requirements.lock at the same versions.
        # Python 3.10 bundles pip 23.0.1, which rejects a dependency with extras (twisted[tls]) in hash mode.
        run: |
          python -m pip install pip==25.1.1
          pip install --require-hashes -r requirements-dev.lock

      - name: Ruff
        run: |
          ruff check
          ruff format --check

      # The import contracts in .importlinter, generated from tests/architecture/module_graph.toml.
      - name: Import contracts
        run: lint-imports --no-cache

      - name: Unit tests (SQLite tier)
        run: |
          cp .env.sample .env
          scripts/test.sh tests/ building_blocks/

  legacy:
    name: legacy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install mysqlclient's build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        # Every package pinned and hash-checked (issue 0039). It includes requirements.lock at the same versions.
        # Python 3.10 bundles pip 23.0.1, which rejects a dependency with extras (twisted[tls]) in hash mode.
        run: |
          python -m pip install pip==25.1.1
          pip install --require-hashes -r requirements-dev.lock

      # The suite has known failures, so its exit code is ignored here. The ratchet decides,
      # and it also fails if pytest crashed before writing the report.
      - name: Whole suite (SQLite tier)
        run: |
          cp .env.sample .env
          scripts/test.sh --junitxml=legacy.xml -p no:cacheprovider 2>&1 | tee legacy.log || true

      - name: Compare with the baseline
        run: python scripts/legacy_ratchet.py legacy.xml

      # New code can't raise Django removal warnings (they're errors there); this counts the rest.
      - name: Count legacy deprecation warnings
        if: always()
        run: |
          { grep -h "Django deprecation warnings from legacy code" legacy.log || echo "No count: the suite didn't finish."; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-junit
          path: legacy.xml
          if-no-files-found: ignore
          retention-days: 7

  mysql:
    name: mysql (${{ matrix.mysql }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: test_mulearn
        # Published on the runner's loopback only.
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      # A literal, not a secret: the database exists only for this job and holds no real data.
      TEST_DB_PASSWORD: ci-only-password
      MYSQL_PWD: ci-only-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install mysqlclient's build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        # Every package pinned and hash-checked (issue 0039). It includes requirements.lock at the same versions.
        # Python 3.10 bundles pip 23.0.1, which rejects a dependency with extras (twisted[tls]) in hash mode.
        run: |
          python -m pip install pip==25.1.1
          pip install --require-hashes -r requirements-dev.lock

      # Binary logging is on in the image, and the schema's DEFAULT (UUID()) columns fail with
      # ERROR 1674 unless it is off for the loading session (schema/README.md).
      - name: Load the vendored schema and the system user
        run: |
          mysql --version
          mysql --protocol=TCP -h 127.0.0.1 -u root --init-command="SET SESSION sql_log_bin=0" test_mulearn < schema/latest.sql
          mysql --protocol=TCP -h 127.0.0.1 -u root test_mulearn < scripts/seed-system-user.sql

      - name: MySQL tier
        run: |
          cp .env.sample .env
          scripts/test.sh --mysql tests/ building_blocks/
